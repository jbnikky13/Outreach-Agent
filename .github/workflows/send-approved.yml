name: Outreach Agent - Send Approved

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: "Supabase campaign UUID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  send-approved:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Send approved outreach
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
          MAIL_CLIENT_ID: ${{ secrets.MAIL_CLIENT_ID }}
          MAIL_CLIENT_SECRET: ${{ secrets.MAIL_CLIENT_SECRET }}
          MAIL_REFRESH_TOKEN: ${{ secrets.MAIL_REFRESH_TOKEN }}
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          echo "Approved-send workflow is ready."
          echo "Campaign: $CAMPAIGN_ID"
          # Production runner will send ONLY drafts marked approved.
